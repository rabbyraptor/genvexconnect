name: DEV3 read-only remote contracts

on:
  push:
    branches:
      - feature/dev3-live-once
      - feature/dev4-persistent-session
  pull_request:
    paths:
      - 'genvex-nabto-remote/runtime/**'
      - 'genvex-nabto-remote/scripts/haos_live_once_operator.py'
      - 'genvex-nabto-remote/tests/test_live_once.py'
      - 'genvex-nabto-remote/tests/test_haos_live_once_operator.py'
      - 'genvex-nabto-remote/tests/test_dev3_polling_state.py'
      - 'genvex-nabto-remote/tests/test_dev3_polling_http_recovery.py'
      - 'genvex-nabto-remote/tests/test_dev3_recovery_policy.py'
      - 'genvex-nabto-remote/tests/test_dev3_recovery_subprocess.py'
      - 'genvex-nabto-remote/tests/test_dev3_process_safety.py'
      - 'genvex-nabto-remote/tests/test_dev3_persistent_adapter.py'
      - 'genvex-nabto-remote/tests/test_dev4_mode_switch.py'
      - 'genvex-nabto-remote/tests/test_dev4_source_baseline.py'
      - 'scripts/dev4_source_baseline_preflight.py'
      - 'genvex-nabto-remote/tests/test_dev3_persistent_live_operator.py'
      - 'genvex-nabto-remote/tests/test_dev3_real_loopback_ipc.py'
      - 'genvex-nabto-remote/tests/test_dev3_ipc_once.py'
      - 'genvex-nabto-remote/scripts/haos_core_ipc_network_operator.py'
      - 'genvex-nabto-remote/tests/test_dev3_haos_core_ipc_operator.py'
      - 'genvex-nabto-remote/scripts/haos_core_live_once_operator.py'
      - 'genvex-nabto-remote/tests/test_dev3_haos_core_live_once_operator.py'
      - 'genvex-nabto-remote/scripts/haos_install_remote_component.py'
      - 'genvex-nabto-remote/tests/test_dev3_haos_component_install.py'
      - 'genvex-nabto-remote/scripts/haos_app_network_preflight.py'
      - 'genvex-nabto-remote/tests/test_dev3_haos_app_network_preflight.py'
      - 'genvex-nabto-remote/scripts/haos_core_live_entity_once_operator.py'
      - 'genvex-nabto-remote/tests/test_dev3_haos_core_live_once_entities.py'
      - 'genvex-nabto-remote/tests/test_dev3_ipc_core_live_once.py'
      - 'experimental/home_assistant/custom_components/genvex_remote/**'
      - 'experimental/home_assistant/tests/test_dev3_coordinator.py'
      - 'experimental/home_assistant/tests/test_dev3_sensor_availability.py'
      - 'experimental/home_assistant/tests/test_entity_translations.py'
      - '.github/workflows/dev3-live-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-single-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: genvex-nabto-remote
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q runtime scripts/haos_live_once_operator.py tests/test_live_once.py tests/test_haos_live_once_operator.py tests/test_dev3_polling_state.py tests/test_dev3_polling_http_recovery.py tests/test_dev3_recovery_policy.py tests/test_dev3_recovery_subprocess.py tests/test_dev3_process_safety.py tests/test_dev3_real_loopback_ipc.py tests/test_dev3_ipc_once.py scripts/haos_core_ipc_network_operator.py tests/test_dev3_haos_core_ipc_operator.py scripts/haos_core_live_once_operator.py tests/test_dev3_haos_core_live_once_operator.py scripts/haos_install_remote_component.py tests/test_dev3_haos_component_install.py scripts/haos_app_network_preflight.py tests/test_dev3_haos_app_network_preflight.py scripts/haos_core_live_entity_once_operator.py tests/test_dev3_haos_core_live_once_entities.py tests/test_dev3_ipc_core_live_once.py ../experimental/home_assistant/custom_components/genvex_remote ../experimental/home_assistant/tests/test_dev3_coordinator.py ../experimental/home_assistant/tests/test_dev3_sensor_availability.py
      - name: Test single-shot contract and operator launcher (no network credentials)
        run: python -m unittest discover -s tests -p 'test_*live_once*.py' -v
      - name: Test atomic snapshot state and bounded polling (no SDK)
        run: python -m unittest discover -s tests -p 'test_dev3_polling_state.py' -v
      - name: "Test real scheduled polling over loopback HTTP (200-503-200; no SDK)"
        run: python -m unittest discover -s tests -p 'test_dev3_polling_http_recovery.py' -v
      - name: Test bounded opt-in Nabto recovery policy (no SDK)
        run: python -m unittest discover -s tests -p 'test_dev3_recovery_policy.py' -v
      - name: Test actual isolated subprocess replacement on eligible failure (no SDK)
        run: python -m unittest discover -s tests -p 'test_dev3_recovery_subprocess.py' -v
      - name: Test child timeout and cancellation cleanup (no SDK)
        run: python -m unittest discover -s tests -p 'test_dev3_process_safety.py' -v
      - name: Test persistent Nabto worker lifecycle and recovery (fake SDK/subprocess only)
        run: python -m unittest discover -s tests -p 'test_dev3_persistent_adapter.py' -v
      - name: Syntax check pinned persistent HAOS operator shell
        run: bash -n scripts/run_haos_persistent_gate_from_deck.sh
      - name: Verify pinned installed DEV3 source preflight contract (fake-only)
        run: python -m unittest discover -s tests -p 'test_dev4_source_baseline.py' -v
      - name: Test opt-in persistent App mode and legacy default (no SDK)
        run: python -m unittest discover -s tests -p 'test_dev4_mode_switch.py' -v
      - name: Test bounded persistent adapter live operator (fake-only)
        run: python -m unittest discover -s tests -p 'test_dev3_persistent_live_operator.py' -v
      - name: Test actual local TCP snapshot HTTP listener (no SDK)
        run: python -m unittest discover -s tests -p 'test_dev3_real_loopback_ipc.py' -v
      - name: Test single-RPC private IPC operator smoke contract (no SDK)
        run: python -m unittest discover -s tests -p 'test_dev3_ipc_once.py' -v
      - name: Test HAOS Core private-network operator (fake-only)
        run: python -m unittest discover -s tests -p 'test_dev3_haos_core_ipc_operator.py' -v
      - name: Test real-RPC Core IPC service with mocked SDK
        run: python -m unittest discover -s tests -p 'test_dev3_ipc_core_live_once.py' -v
      - name: Test actual Core TCP client and real once operator (fake-only)
        run: python -m unittest discover -s tests -p 'test_dev3_haos_core_live_once_operator.py' -v
      - name: Verify English fallback and Danish sensor translation coverage
        run: python -m unittest discover -s ../experimental/home_assistant/tests -p 'test_entity_translations.py' -v
      - name: Test atomic remote integration installer and LAN isolation
        run: python -m unittest discover -s tests -p 'test_dev3_haos_component_install.py' -v
      - name: Test read-only HAOS App metadata and DNS preflight (no credentials)
        run: python -m unittest discover -s tests -p 'test_dev3_haos_app_network_preflight.py' -v
      - name: Test five HA sensor entity availability transitions (without HA Core)
        run: python -m unittest discover -s ../experimental/home_assistant/tests -p 'test_dev3_sensor_availability.py' -v
      - name: Test HA coordinator unavailable and recovery (without HA Core)
        run: python -m unittest discover -s ../experimental/home_assistant/tests -p 'test_dev3_coordinator.py' -v

  arm64-app-image:
    # Build the actual development image on ARM64, without any private profile.
    if: github.event_name == 'push'
    uses: ./.github/workflows/remote-app-image-build.yml
    permissions:
      contents: read
