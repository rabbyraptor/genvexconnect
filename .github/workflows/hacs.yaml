name: Marketplace repository validation

on:
  push: 
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      # Marketplace 2026.11+ continues to use the historic hacs/action tool.
      - name: Marketplace repository checks (hacs/action)
        uses: "hacs/action@main"
        with:
          category: "integration"
